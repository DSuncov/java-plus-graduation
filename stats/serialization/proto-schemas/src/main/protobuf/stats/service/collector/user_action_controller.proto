syntax = "proto3";

package stats.service.collector;

import "stats/message/collector/user_action.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "ru.practicum.grpc.stats.collector";

service UserActionController {
  rpc CollectUserAction (stats.message.collector.UserActionProto)
      returns (google.protobuf.Empty);
}